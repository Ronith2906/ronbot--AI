<!DOCTYPE html>
<html>
<head>
    <title>Microphone Test</title>
</head>
<body>
    <h1>Microphone Permission Test</h1>
    <button onclick="testMicrophone()">Test Microphone Access</button>
    <div id="result"></div>

    <script>
        async function testMicrophone() {
            try {
                document.getElementById('result').innerHTML = 'Requesting microphone permission...';
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                document.getElementById('result').innerHTML = 
                    '<h3 style="color: green;">✅ Microphone access granted!</h3>' +
                    '<p>Your microphone is working and ready for voice input.</p>';
                
                // Stop the stream
                stream.getTracks().forEach(track => track.stop());
                
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<h3 style="color: red;">❌ Microphone access denied</h3>' +
                    '<p>Error: ' + error.message + '</p>' +
                    '<p>Please allow microphone access in your browser settings.</p>';
            }
        }
    </script>
</body>
</html>
